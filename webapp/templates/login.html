{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block classe_main %}centro{% endblock %}
{% block conteudo %}
<div class="cartao cartao-login">
  <div class="marca marca-grande">
    <span class="marca-logo">Med<b>Sênior</b></span>
    <span class="marca-sub">Cartas de Cobrança</span>
  </div>
  <h1 class="titulo-pagina">Entrar</h1>
  {% if erro %}<div class="aviso aviso-erro" role="alert">{{ erro }}</div>{% endif %}
  <form method="post" class="form" autocomplete="on">
    <label class="campo">
      <span>Login</span>
      <input type="text" name="login" required autofocus autocapitalize="none" spellcheck="false">
    </label>
    <label class="campo">
      <span>Senha</span>
      <input type="password" name="senha" required>
    </label>
    <button type="submit" class="btn btn-primario btn-largo">Entrar</button>
  </form>
</div>
{% endblock %}
